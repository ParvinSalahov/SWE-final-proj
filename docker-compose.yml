services:
  postgres:
    image: postgres:16
    container_name: lostfound-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: lostfound
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lostfound
    container_name: lostfound-app
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:dev@postgres:5432/lostfound
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./artefacts:/app/artefacts

volumes:
  postgres_data:
